# Smithery configuration for Buscador Google
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_busca_google

name: busca_google-mcp
displayName: "Buscador Google"
description: >
  Busque no Google direto do seu agente de IA. Resultados da web, imagens, vídeos, notícias, produtos, artigos acadêmicos e patentes, mais a busca de estabelecimentos com telefone, endereço e nota, e a leitura do texto de qualquer página. Aceita até 100 consultas numa chamada só. Hospedado pela plataforma, sem credenciais, você paga por consulta.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/busca_google-mcp
repository: https://github.com/mcp-dir/busca_google-mcp

tags:
  - busca_google
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_busca_google

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_busca_google/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
